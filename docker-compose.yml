services:
  ww-vtt-dev:
    build: .
    container_name: ww-vtt-dev
    volumes:
      - ${HOME}/wayworlds-vtt:${HOME}/wayworlds-vtt
      - ww_server_node_modules:${HOME}/wayworlds-vtt/server/node_modules
      - ww_client_node_modules:${HOME}/wayworlds-vtt/client/node_modules
    ports:
      - "3000:3000"
      - "3001:3001"
    working_dir: ${HOME}/wayworlds-vtt
    environment:
      - HOME=${HOME}
    command: tail -f /dev/null

volumes:
  ww_server_node_modules:
  ww_client_node_modules:
